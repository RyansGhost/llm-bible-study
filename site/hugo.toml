baseURL = "https://llm-bible-study.ryanfleck.ca/"
title = "LLM Bible Study"
locale = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Structured, well-grounded Bible study with an AI language model: learn each book of the Bible, its major people and themes, and its morals and lessons, from Reformed sources."
  repo = "https://github.com/RyansGhost/llm-bible-study"
  # The skill's SKILL.md, published at the site root by _partials/publish-skill.html
  # with its links made absolute, beside /tracker-template.md. Same domain as
  # llms.txt: some AI fetch tools refuse raw.githubusercontent.com. The build
  # stops if the published URL ever differs from this one.
  skillURL = "https://llm-bible-study.ryanfleck.ca/SKILL.md"

# The book files live inside the Claude skill, so they are written once and
# used by both the skill and this site. Declaring any mount replaces Hugo's
# default content mount, so "content" has to be listed again.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../plugin/skills/bible-study/books"
    target = "content/books"
  # The skill's source list doubles as the site's /sources/ page.
  [[module.mounts]]
    source = "../plugin/skills/bible-study"
    target = "content"
    files = ["sources.md"]
  # The skill's SKILL.md is also read as an asset, so llms.txt can quote its
  # teaching method word for word, and it and tracker-template.md are published
  # at the site root. Re-list the default assets mount too.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../plugin/skills/bible-study"
    target = "assets/skill"
    files = ["SKILL.md", "tracker-template.md"]

# Allow the footer to read Cloudflare Pages' build variables (commit and branch).
[security.funcs]
  getenv = ["^HUGO_", "^CI$", "^CF_PAGES_"]

[permalinks.page]
  books = "/books/:slug/"

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.markdown]
    mediaType = "text/markdown"
    isPlainText = true
    baseName = "index"
  [outputFormats.llms]
    mediaType = "text/plain"
    isPlainText = true
    baseName = "llms"
    notAlternative = true
  # books/<book>/index-for-copy.md: the study prompt in <instructions> and the notes in
  # <notes>, fetched by the book page's copy button (layouts/page.copy.md). Enabled for
  # the book pages only, by the cascade in content/books/_index.md.
  [outputFormats.copy]
    mediaType = "text/markdown"
    isPlainText = true
    baseName = "index-for-copy"
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML"]
  page = ["HTML", "markdown"]

[markup.goldmark.renderer]
  unsafe = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
