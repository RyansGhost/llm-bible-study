name: Release skill zip

# Publishes a GitHub release with bible-study.zip attached. The zip holds the
# bible-study/ folder with SKILL.md inside, the shape the Claude app expects.
#
# Two ways to run it:
#   - push a tag like v0.1.0
#   - run it by hand (Actions tab → Release skill zip → Run workflow) with a
#     version like v0.1.0; it tags the commit it runs on.
# Either way the version must match "version" in plugin/.claude-plugin/plugin.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches plugin.json
        run: |
          plugin_version="v$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if [ "$VERSION" != "$plugin_version" ]; then
            echo "::error::Release $VERSION doesn't match plugin.json version $plugin_version"
            exit 1
          fi

      - name: Build the skill zip
        run: |
          cd plugin/skills
          zip -r "$GITHUB_WORKSPACE/bible-study.zip" bible-study -x '*.DS_Store'
          unzip -l "$GITHUB_WORKSPACE/bible-study.zip" | grep -q ' bible-study/SKILL.md$'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" bible-study.zip --clobber
          else
            gh release create "$VERSION" bible-study.zip \
              --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
